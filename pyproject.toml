[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freightid"
version = "0.1.1"
description = "Validate and explain logistics identifiers: ISO 6346 container numbers, IMO ship numbers, SCAC, UN/LOCODE, USDOT and MC. Checks math and format, never registration."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "Novacrest", email = "hello@novacrest.ai"}]
keywords = ["logistics", "shipping", "container", "iso-6346", "imo", "scac", "unlocode", "usdot", "validation", "check-digit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://binlogic.io/free-tools/freightid"
Repository = "https://github.com/novacrest-ai/freightid"
Documentation = "https://github.com/novacrest-ai/freightid#readme"

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
freightid = "freightid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freightid"]
